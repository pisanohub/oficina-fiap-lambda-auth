name: CI - Build e testes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Compilar, testar e empacotar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e executar os testes
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publicar o artefato da Lambda
        uses: actions/upload-artifact@v4
        with:
          name: oficina-cpf-auth
          path: target/oficina-cpf-auth.jar
          if-no-files-found: error
          retention-days: 7

